/* =========================================================================

const SIZES = ['S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL'];

// ---------- utilidades ----------
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const money = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: db.settings.currency || 'EUR' }).format(n || 0);
const units = (items) => SIZES.reduce((a, s) => a + (items?.[s] || 0), 0);

function teeSvg(fill, ink, label) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1000'><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#f1f5f9'/><stop offset='1' stop-color='#dbe2ea'/></linearGradient><linearGradient id='sh' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#000' stop-opacity='.10'/><stop offset='.5' stop-color='#000' stop-opacity='0'/><stop offset='1' stop-color='#000' stop-opacity='.12'/></linearGradient></defs><rect width='800' height='1000' fill='url(#bg)'/><ellipse cx='400' cy='900' rx='230' ry='22' fill='#000' opacity='.08'/><path d='M275 170 L195 195 L80 300 L155 425 L220 385 L220 870 L580 870 L580 385 L645 425 L720 300 L605 195 L525 170 Q400 255 275 170Z' fill='${fill}' stroke='${ink}' stroke-opacity='.35' stroke-width='5' stroke-linejoin='round'/><path d='M220 385 L220 870 L580 870 L580 385' fill='url(#sh)'/><path d='M275 170 Q400 255 525 170' fill='none' stroke='${ink}' stroke-opacity='.45' stroke-width='12'/><text x='400' y='540' font-family='Helvetica,Arial' font-weight='800' font-size='56' letter-spacing='4' text-anchor='middle' fill='${ink}'>${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const fallbackFor = (m) => teeSvg(m?.color || '#cbd5e1', m?.ink || '#334155', 'TEE');
const imgTag = (src, m, cls = '') =>
  `<img src="${esc(src)}" alt="${esc(m?.name || '')}" class="${cls}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackFor(m)}'">`;

// ---------- datos en Supabase ----------
// Cada entidad se guarda tal cual en la columna jsonb "data" de su tabla; las reglas de seguridad (RLS)
// deciden qué puede leer y escribir cada usuario. Ver supabase/schema.sql.
const SB_URL = 'https://jyqdglmhsbuzvivxmdkp.supabase.co';
const SB_KEY = 'sb_publishable_BRVEWF8vro8wpiT3xhVQWg_40i4Hjpc'; // clave pública: segura en el navegador gracias a RLS
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const TABLES = ['categories', 'models', 'orders', 'notifications', 'emails', 'contact'];

// Preferencias de este dispositivo (aviso de instalación); si el navegador bloquea el almacenamiento, en memoria.
function safeStore(kind) {
  try { const s = window[kind]; s.getItem('x'); return s; }
  catch { const m = {}; return { getItem: k => m[k] ?? null, setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }
}
const store = safeStore('localStorage');

const emptyDb = () => ({ users: [], categories: [], models: [], orders: [], notifications: [], emails: [], contact: [],
  settings: { currency: 'EUR', maxUnits: 5, alertEmail: true, alertNotif: true } });
let db = emptyDb();
let synced = {}; // copia de lo último leído/escrito en la nube, para enviar solo los cambios

const profileToUser = (p) => ({ id: p.id, name: p.name, username: p.username, email: p.email, phone: p.phone || '', role: p.role, active: p.active, needsPassword: p.needs_password, pending: !!p.pending, inactiveFlagAt: p.inactive_flag_at, createdAt: p.created_at });

async function fetchAll() {
  const [pr, st, ...rest] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('settings').select('data').eq('id', 1).maybeSingle(),
    ...TABLES.map(t => sb.from(t).select('id,data')),
  ]);
  const bad = [pr, st, ...rest].find(r => r.error);
  if (bad) throw bad.error;
  const next = emptyDb();
  next.users = pr.data.map(profileToUser);
  if (st.data) Object.assign(next.settings, st.data.data);
  TABLES.forEach((t, i) => { next[t] = rest[i].data.map(r => r.data); });
  db = next;
  synced = Object.fromEntries(TABLES.map(t => [t, new Map(db[t].map(r => [r.id, JSON.stringify(r)]))]));
  synced.settings = JSON.stringify(db.settings);
}

// La interfaz modifica `db` y llama a save(): aquí se calculan las diferencias y se envían en orden.
let syncChain = Promise.resolve();
function save() {
  syncChain = syncChain.then(pushChanges).catch(async (e) => {
    console.error(e);
    toast('No se pudo guardar: ' + (e.message || e), 'error');
    try { await fetchAll(); } catch {}
    render();
  });
  return true;
}
async function pushChanges() {
  for (const t of TABLES) {
    const prev = synced[t], cur = new Map(db[t].map(r => [r.id, r]));
    const added = [...cur.values()].filter(r => !prev.has(r.id));
    const changed = [...cur.values()].filter(r => prev.has(r.id) && prev.get(r.id) !== JSON.stringify(r));
    const removed = [...prev.keys()].filter(id => !cur.has(id));
    if (added.length) {
      const { error } = await sb.from(t).insert(added.map(r => ({ id: r.id, data: r })));
      if (error) throw error;
      added.forEach(r => prev.set(r.id, JSON.stringify(r)));
    }
    for (const r of changed) {
      const { error } = await sb.from(t).update({ data: r }).eq('id', r.id);
      if (error) throw error;
      prev.set(r.id, JSON.stringify(r));
    }
    if (removed.length) {
      const { error } = await sb.from(t).delete().in('id', removed);
      if (error) throw error;
      removed.forEach(id => prev.delete(id));
    }
  }
  const s = JSON.stringify(db.settings);
  if (s !== synced.settings && me()?.role === 'admin') {
    const { error } = await sb.from('settings').upsert({ id: 1, data: db.settings });
    if (error) throw error;
    synced.settings = s;
  }
}

// Tiempo real: cualquier cambio en la base de datos (de otro usuario o dispositivo) se refleja al momento.
let rtChannel = null, rtTimer = null;
function subscribeRealtime() {
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel('lpm-cambios')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => { clearTimeout(rtTimer); rtTimer = setTimeout(refreshFromCloud, 400); })
    .subscribe();
}
async function refreshFromCloud() {
  if (!ui.sessionId) return;
  await syncChain;
  const known = new Set(db.notifications.map(n => n.id));
  try { await fetchAll(); } catch (e) { console.warn(e); return; }
  db.notifications.filter(n => n.to === ui.sessionId && !n.read && !known.has(n.id)).forEach(n => { sysNotify(n.title, n.body); toast(n.title, 'info'); });
  const el = document.activeElement, id = el?.id, pos = el?.selectionStart;
  render();
  if (id && document.getElementById(id)) { const e2 = document.getElementById(id); e2.focus(); try { e2.setSelectionRange(pos, pos); } catch {} }
}

async function uploadPhoto(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const path = `modelos/${uid('f')}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
  if (error) throw error;
  return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
}

// ---------- estado de interfaz ----------
const ui = { sessionId: null, loading: false, tab: null, sel: {}, filters: { model: '', status: '', q: '', cat: '', from: '', to: '', pfrom: '', pto: '', puser: '' }, tables: {}, panelPaidOnly: false, draft: null, cat: '', modelCat: '', panelCat: '' };
const me = () => db.users.find(u => u.id === ui.sessionId && u.active);
const NO_CAT = '_none';
const catOf = (m) => db.categories.some(c => c.id === m?.categoryId) ? m.categoryId : NO_CAT;
const catName = (id) => db.categories.find(c => c.id === id)?.name || 'Sin tipo';
const inCat = (m, cat) => !cat || catOf(m) === cat;
const liveModels = () => db.models.filter(m => !m.deletedAt);
const userById = (id) => db.users.find(u => u.id === id);
const modelById = (id) => db.models.find(m => m.id === id);

// ---------- toasts y modales ----------
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  const col = type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-slate-800' : 'bg-pitch-600';
  el.className = `fade-in pointer-events-auto ${col} text-white text-sm px-4 py-2.5 rounded-xl shadow-lg max-w-md`;
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function openModal(html, wide = false) {
  ui.inboxOpen = false;
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 p-0 sm:p-4" onclick="if(event.target===this)App.closeModal()">
      <div class="fade-in bg-white w-full ${wide ? 'sm:max-w-3xl' : 'sm:max-w-lg'} max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl shadow-2xl">${html}</div>
    </div>`;
}
function closeModal() { ui.inboxOpen = false; document.getElementById('modal-root').innerHTML = ''; }
// Si el Buzón está abierto, se vuelve a pintar con los datos nuevos sin perder el scroll ni lo que se está escribiendo.
function refreshInbox() {
  const box = document.querySelector('#modal-root .fade-in');
  if (!ui.inboxOpen || !box) return;
  const scroll = box.scrollTop, focus = document.activeElement?.id;
  const drafts = [...box.querySelectorAll('textarea[id]')].map(t => [t.id, t.value]);
  box.innerHTML = inboxSheet();
  drafts.forEach(([id, v]) => { const t = document.getElementById(id); if (t) t.value = v; });
  box.scrollTop = scroll;
  if (focus) document.getElementById(focus)?.focus();
}

// ---------- iconos ----------
const ic = {
  shirt: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linejoin="round" d="M8 3 3.5 5.5 2 10l3 1.2V21h14v-9.8L22 10l-1.5-4.5L16 3c-.8 1.4-2.2 2.2-4 2.2S8.8 4.4 8 3Z"/></svg>',
  trash: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  edit: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linejoin="round" d="m4 20 4-1 11-11-3-3L5 16l-1 4Z"/></svg>',
  plus: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>',
  dl: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>',
  x: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>',
  install: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7v7m0 0-3-3m3 3 3-3"/></svg>',
};
// iconos de la navegación (inferior en móvil)
const navIc = {
  panel: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',

  modelos: '<path d="M8 3 3.5 5.5 2 10l3 1.2V21h14v-9.8L22 10l-1.5-4.5L16 3c-.8 1.4-2.2 2.2-4 2.2S8.8 4.4 8 3Z"/>',
  usuarios: '<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M16 3.5a4 4 0 0 1 0 7.5M18 14.5c2.4.9 4 3.2 4 6.5"/>',
  ajustes: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

};
const navSvg = (k, cls = 'w-6 h-6') => `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" viewBox="0 0 24 24">${navIc[k]}</svg>`;

const APP_NAME = 'La Prima Mery';
const CONTACT_EMAIL = 'laprimamery@gmail.com';

const badge = (status) => { const [l, c] = STATUS[status] || STATUS.pendiente; return `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full ring-1 px-2 py-0.5 text-xs font-semibold ${c}">● ${l}</span>`; };
const fmtDay = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
const deliveryDate = (o) => o.delivery?.date ? fmtDay(o.delivery.date) : o.confirmation?.eta || '';
const sizeChips = (items) => SIZES.filter(s => items?.[s]).map(s =>
  `<span class="inline-block rounded-md bg-slate-100 px-1.5 py-0.5 text-xs font-semibold text-slate-700">${s}×${items[s]}</span>`).join(' ');
const btn = 'inline-flex items-center justify-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed';

// RENDER
// =========================================================================
function render() {
  const u = me();
  const app = document.getElementById('app');
  if (ui.loading) { app.innerHTML = `<div class="min-h-screen grid place-items-center"><div class="text-center">${logoFull('w-40 h-auto mx-auto animate-pulse')}<p class="text-sm text-slate-500 mt-3">Cargando…</p></div></div>`; return; }
  if (!u) { app.innerHTML = renderLogin(); return; }
  if (!ui.tab) ui.tab = u.role === 'admin' ? 'panel' : 'catalogo';
  const tabs = u.role === 'admin'
    ? [['panel', 'Panel'], ['pedidos', 'Pedidos'], ['modelos', 'Modelos'], ['usuarios', 'Usuarios'], ['ajustes', 'Ajustes']]
    : [['catalogo', 'Catálogo'], ['mis', 'Mis pedidos'], ['contacto', 'Contacto' + countPill(unreadThreads())]];
  if (!tabs.some(([k]) => k === ui.tab)) ui.tab = tabs[0][0];
  const body = {
    panel: renderPanel, pedidos: renderOrders, modelos: renderModels, usuarios: renderUsers, ajustes: renderSettings,
    catalogo: renderCatalog, mis: renderMyOrders, contacto: renderContact,
  }[ui.tab]?.() ?? '';
  const roleTag = `<span class="text-xs font-semibold rounded-full px-2 py-0.5 ${u.role === 'admin' ? 'bg-brand-50 text-brand-700' : 'bg-pitch-50 text-pitch-700'}">${u.role === 'admin' ? 'Admin' : 'Usuario'}</span>`;
  app.innerHTML = `
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-cream-200 pt-[env(safe-area-inset-top)]">
      <div class="franja"></div>
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">

function bccBatches(emails, maxChars = 1500) {
  const out = [];
  let cur = [], len = 0;
  for (const e of emails) {
    if (cur.length && len + e.length + 1 > maxChars) { out.push(cur); cur = []; len = 0; }
    cur.push(e); len += e.length + 1;
  }
  if (cur.length) out.push(cur);
  return out;
}

// ---------- OFERTAS ----------
// model.offer = { active, type: 'percent'|'units'|'time', percent, buy, pay, endsAt }
//   percent → descuento fijo · units → «lleva N y paga M» (lote) · time → descuento hasta endsAt (cuenta atrás)
// Cada pedido guarda una copia de la oferta con la que se hizo (order.offer) para que su precio no cambie después.
const offerActive = (m) => {
  const o = m?.offer;
  if (!o?.active) return false;
  if (o.type === 'time') return new Date(o.endsAt).getTime() > Date.now();
  return o.type === 'units' ? o.buy > o.pay && o.pay > 0 : o.percent > 0;
};
const offerSnapshot = (m) => offerActive(m) ? { type: m.offer.type, percent: m.offer.percent, buy: m.offer.buy, pay: m.offer.pay, endsAt: m.offer.endsAt || null } : null;
// Precio total de `qty` unidades con la oferta aplicada.
function offerPrice(offer, unitPrice, qty) {
  if (!offer) return unitPrice * qty;
  if (offer.type === 'units') return (Math.floor(qty / offer.buy) * offer.pay + qty % offer.buy) * unitPrice;
  return Math.round(unitPrice * qty * (100 - offer.percent)) / 100;
}
const offerShort = (o) => o.type === 'units' ? `${o.buy}x${o.pay}` : `−${o.percent}%`;
const offerLong = (o) => o.type === 'units' ? `Oferta ${o.buy}x${o.pay}: lleva ${o.buy} y paga ${o.pay}` : o.type === 'time' ? `−${o.percent}% por tiempo limitado` : `${o.percent}% de descuento`;
function countdown(endsAt) {
  const ms = new Date(endsAt).getTime() - Date.now();
  if (ms <= 0) return 'Finalizada';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), min = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  const p = (n) => String(n).padStart(2, '0');
  return d ? `Quedan ${d}d ${p(h)}h ${p(min)}m` : `Quedan ${p(h)}:${p(min)}:${p(s)}`;
}
// Etiqueta sobre la foto principal (catálogo y modelos del administrador)
function offerBadge(m) {
  if (!offerActive(m)) return '';
  const o = m.offer;
  return `<div class="rounded-xl bg-brand-600 text-white shadow-lg ring-2 ring-gold-400/80 px-3 py-1.5 leading-tight">
    <div class="text-[10px] font-bold tracking-[0.18em] text-gold-400">OFERTA</div>
    <div class="font-serif font-bold text-lg">${offerShort(o)}</div>
    ${o.type === 'time' ? `<div class="text-[11px] font-semibold tabular-nums" data-ends="${esc(o.endsAt)}">${countdown(o.endsAt)}</div>` : ''}

}

// ---------- USUARIO: catálogo ----------
function myOrderFor(modelId) { return db.orders.find(o => o.userId === ui.sessionId && o.modelId === modelId); }
function selFor(m) {
  if (!ui.sel[m.id]) { const o = myOrderFor(m.id); ui.sel[m.id] = { items: { ...(o?.items || {}) }, img: 0 }; }
  return ui.sel[m.id];
}
// Fila de filtros por tipo de modelo. `models` da los recuentos; `setter` es la acción de App que recibe el id.
function catChips(current, setter, models, showEmpty = false) {
  const count = (id) => models.filter(m => catOf(m) === id).length;
  const cats = [...db.categories.map(c => [c.id, c.name]), [NO_CAT, 'Sin tipo']]
    .filter(([id]) => showEmpty && id !== NO_CAT ? true : count(id) > 0 || id === current);
  const chip = (id, label, n) => `<button onclick="App.${setter}('${id}')" class="whitespace-nowrap rounded-full px-3.5 py-1.5 text-sm font-semibold ring-1 transition ${current === id ? 'bg-brand-600 text-white ring-brand-600' : 'bg-white text-slate-600 ring-slate-200 hover:ring-slate-300'}">${esc(label)} <span class="${current === id ? 'text-white/60' : 'text-slate-400'}">${n}</span></button>`;
  return `<div class="flex gap-2 overflow-x-auto scroll-thin pb-1 -mx-4 px-4 sm:mx-0 sm:px-0 sm:flex-wrap">${chip('', 'Todos', models.length)}${cats.map(([id, l]) => chip(id, l, count(id))).join('')}</div>`;
}
// Visor de fotos a pantalla completa: se desliza con el dedo (o flechas/teclado en PC) entre las fotos del modelo.
function openViewer(mid) {
  const m = modelById(mid), imgs = m.images.length ? m.images : [fallbackFor(m)];
  const start = (ui.sel[mid]?.img || 0) % imgs.length, many = imgs.length > 1;
  const arrow = (d, path, side) => `<button onclick="App.viewerStep(${d})" class="hidden sm:grid absolute ${side} top-1/2 -translate-y-1/2 place-items-center w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white" aria-label="${d < 0 ? 'Foto anterior' : 'Foto siguiente'}"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${path}"/></svg></button>`;
  const el = document.createElement('div');
  el.id = 'viewer';
  el.className = 'fixed inset-0 z-[60] bg-black/95 flex flex-col fade-in';
  el.innerHTML = `
    <div class="flex items-center gap-3 px-4 pt-[calc(0.75rem+env(safe-area-inset-top))] pb-3 text-white">
      <span class="flex-1 font-semibold truncate">${esc(m.name)}</span>
      ${many ? '<span id="viewer-n" class="text-sm text-white/70"></span>' : ''}
      <button onclick="App.closeViewer()" class="grid place-items-center w-10 h-10 rounded-full hover:bg-white/10" aria-label="Cerrar">${ic.x}</button>
    </div>
    <div class="relative flex-1 min-h-0">
      <div id="viewer-track" class="h-full flex overflow-x-auto snap-x snap-mandatory" style="scrollbar-width:none">
        ${imgs.map(src => `<div class="w-full h-full shrink-0 snap-center grid place-items-center p-2 sm:p-6" onclick="if(event.target===this)App.closeViewer()">${imgTag(src, m, 'max-w-full max-h-full object-contain select-none')}</div>`).join('')}
      </div>
      ${many ? arrow(-1, 'm15 18-6-6 6-6', 'left-3') + arrow(1, 'm9 18 6-6-6-6', 'right-3') : ''}
    </div>
    ${many ? `<div id="viewer-dots" class="flex justify-center gap-2 pt-3 pb-[calc(1rem+env(safe-area-inset-bottom))]">${imgs.map(() => '<span class="w-2 h-2 rounded-full bg-white/40"></span>').join('')}</div>` : '<div class="pb-[env(safe-area-inset-bottom)]"></div>'}`;
  el.querySelectorAll('img').forEach(i => { i.loading = 'eager'; });
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const track = el.querySelector('#viewer-track');
  const sync = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (ui.sel[mid]) ui.sel[mid].img = i;
    if (!many) return;
    el.querySelector('#viewer-n').textContent = `${i + 1} / ${imgs.length}`;
    el.querySelectorAll('#viewer-dots span').forEach((d, k) => d.className = `w-2 h-2 rounded-full ${k === i ? 'bg-white' : 'bg-white/40'}`);
  };
  track.scrollLeft = start * track.clientWidth;
  track.addEventListener('scroll', sync, { passive: true });
  sync();
  ui.viewerKeys = (e) => { if (e.key === 'Escape') App.closeViewer(); else if (e.key === 'ArrowLeft') App.viewerStep(-1); else if (e.key === 'ArrowRight') App.viewerStep(1); };
  document.addEventListener('keydown', ui.viewerKeys);
}
function closeViewer() {
  document.getElementById('viewer')?.remove();
  document.body.style.overflow = '';
  document.removeEventListener('keydown', ui.viewerKeys);
  render(); // la tarjeta se queda en la última foto vista
}
const catTag = (m) => `<span class="inline-block rounded-md bg-cream-100 text-gold-700 px-1.5 py-0.5 text-[11px] font-bold uppercase tracking-wide">${esc(catName(catOf(m)))}</span>`;

  if (o.status === 'aprobado') return box('bg-sky-50 ring-sky-100 text-slate-700', `

  if (o.status === 'pago_comunicado') return box('bg-violet-50 ring-violet-100 text-violet-800', `

  return `<div class="flex flex-wrap items-center gap-2 text-xs text-slate-500"><span class="flex-1">Solicitud enviada. Te avisaremos cuando La Prima Mery la apruebe; hasta entonces puedes cambiarla en el catálogo.</span>

// Tabla con un filtro por columna y páginas de 10 filas. El estado (página y filtros) vive en ui.tables[key].

const PAGE_SIZE = 10;
const tableState = (key) => ((ui.tables ||= {})[key] ||= { page: 0, f: {} });
function dataTable(key, cols, rows, emptyText, minWidth = 760) {
  const st = tableState(key);
  const filtered = rows.filter(r => cols.every(c => {
    const v = (st.f[c.key] || '').trim().toLowerCase();
    if (!v) return true;
    if (c.options) return c.match ? c.match(r, st.f[c.key]) : String(c.text(r) ?? '') === st.f[c.key];
    return String(c.text(r) ?? '').toLowerCase().includes(v);
  }));
  const sc = st.sort && cols.find(c => c.key === st.sort.key && c.sort);
  if (sc) filtered.sort((a, b) => { const x = sc.sort(a), y = sc.sort(b); return (x > y ? 1 : x < y ? -1 : 0) * (st.sort.dir === 'asc' ? 1 : -1); });
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (st.page >= pages) st.page = pages - 1;
  const from = st.page * PAGE_SIZE, slice = filtered.slice(from, from + PAGE_SIZE);
  const hasFilter = Object.values(st.f).some(v => v?.trim());
  return `
    <div class="bg-white rounded-2xl ring-1 ring-slate-200 overflow-hidden">
      <div class="overflow-x-auto scroll-thin">
        <table class="w-full text-sm" style="min-width:${minWidth}px">

              ? `<button type="button" onclick="App.tsort('${key}','${c.key}')" class="inline-flex items-center gap-1 hover:text-brand-700 ${st.sort?.key === c.key ? 'text-brand-700' : ''}" title="Ordenar de mayor a menor / de menor a mayor">${c.label}<span class="text-[10px]">${st.sort?.key === c.key ? (st.sort.dir === 'asc' ? '▲' : '▼') : '⇅'}</span></button>`
              : c.label}</th>`).join('')}</tr>
            <tr>${cols.map(c => `<th class="px-2 pb-2 font-normal">${c.noFilter ? '' : c.options ? `<select onchange="App.tf('${key}','${c.key}',this.value,true)" class="w-full min-w-[80px] rounded-lg border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-brand-500 px-1.5 py-1 text-xs bg-white"><option value="">Todos</option>${c.options.map(o => `<option ${st.f[c.key] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : `<input id="tf-${key}-${c.key}" value="${esc(st.f[c.key] || '')}" oninput="App.tf('${key}','${c.key}',this.value)" placeholder="Filtrar" class="w-full min-w-[70px] rounded-lg border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-brand-500 px-2 py-1 text-xs bg-white">`}</th>`).join('')}</tr>
          </thead>
          <tbody>${slice.map(r => `<tr class="border-t border-slate-100 align-top">${cols.map(c => `<td class="px-3 py-2.5 ${c.cls || ''}">${c.html ? c.html(r) : esc(c.text(r))}</td>`).join('')}</tr>`).join('')
            || `<tr><td colspan="${cols.length}" class="px-4 py-8 text-center text-slate-400">${hasFilter ? 'Nada coincide con los filtros.' : emptyText}</td></tr>`}</tbody>
        </table>
      </div>
      <div class="flex items-center gap-2 px-3 py-2 border-t border-slate-100 text-xs text-slate-500">
        <span class="flex-1">${filtered.length ? `${from + 1}–${from + slice.length} de ${filtered.length}` : '0 resultados'}${hasFilter ? ` · <button class="font-semibold text-brand-700" onclick="App.tclear('${key}')">Quitar filtros</button>` : ''}</span>
        <button class="${btnS} !px-2.5 !py-1" ${st.page === 0 ? 'disabled' : ''} onclick="App.tpage('${key}',-1)" aria-label="Página anterior">‹</button>
        <span class="tabular-nums">${st.page + 1} / ${pages}</span>
        <button class="${btnS} !px-2.5 !py-1" ${st.page >= pages - 1 ? 'disabled' : ''} onclick="App.tpage('${key}',1)" aria-label="Página siguiente">›</button>
      </div>
    </div>`;
}
const inRange = (iso, from, to) => (!from || (iso || '') >= from) && (!to || (iso || '').slice(0, 10) <= to);

}

  return `<article class="bg-white rounded-2xl ring-1 ${unread ? 'ring-brand-500/50' : 'ring-slate-200'} overflow-hidden">
    <button class="w-full text-left p-4 flex items-start gap-3" onclick="App.toggleThread('${t.id}')">

        ${open ? '' : `<span class="block text-sm text-slate-600 mt-1 truncate">${last.from === 'admin' ? 'La Prima Mery: ' : ''}${esc(last.body)}</span>`}
      </span>

          <div class="whitespace-pre-line">${esc(m.body)}</div></div></div>`;

const appUrl = () => location.origin + location.pathname;
const inviteUrl = () => appUrl() + '?registro';
// Código QR que lleva a la app (se genera en el navegador con qrcode-generator).
function qrBlock(url, caption) {
  if (typeof qrcode !== 'function') return '';
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  return `<div class="flex items-center gap-4 rounded-2xl bg-cream-100/70 p-3">
    <div class="w-28 h-28 shrink-0 rounded-xl bg-white p-1.5 ring-1 ring-slate-200 [&>svg]:w-full [&>svg]:h-full">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: 'Código QR de La Prima Mery' })}</div>
    <p class="text-xs text-slate-600">${caption}<span class="block mt-1 text-slate-400 break-all">${esc(url)}</span></p></div>`;
}
// Avisos en la app (y copia en el buzón) del otro lado de la conversación.
function notifyContact(t, first) {
  const last = t.messages.at(-1), preview = last.body.length > 140 ? last.body.slice(0, 140) + '…' : last.body;
  if (last.from === 'user') {
    db.users.filter(a => a.role === 'admin' && a.active && !a.pending).forEach(a => {
      sendNotif(a, `${first ? 'Nueva consulta' : 'Nuevo mensaje'} de ${last.name}: ${t.subject}`, preview, null, { kind: 'contact', threadId: t.id });
      sendMail(a, `[${APP_NAME}] ${first ? 'Nueva consulta' : 'Nuevo mensaje'} de ${last.name}: ${t.subject}`, `${last.name} ${first ? 'ha enviado una consulta' : 'ha escrito en su consulta'} «${t.subject}»:\n\n${last.body}\n\nRespóndela en la pestaña Mensajes.`, null);
    });
  } else {
    const owner = userById(t.userId);
    if (!owner) return;
    sendNotif(owner, `Respuesta a tu consulta: ${t.subject}`, preview, null, { kind: 'contact', threadId: t.id });
    sendMail(owner, `[${APP_NAME}] Respuesta a tu consulta: ${t.subject}`, `Te hemos respondido a tu consulta «${t.subject}»:\n\n${last.body}\n\nPuedes ver la conversación en la pestaña Contacto.`, null);
  }
}

// MEJORA DE FOTOS (canvas)
// =========================================================================
function enhanceImage(file, enhance) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato de imagen no soportado'));
      img.onload = () => {
        const W = 900, H = 1125; // 4:5
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        const c = document.createElement('canvas');
        if (enhance) {
          const target = W / H;
          if (sw / sh > target) { sw = sh * target; sx = (img.width - sw) / 2; } else { sh = sw / target; sy = (img.height - sh) / 2; }
          c.width = W; c.height = H;
        } else {
          const k = Math.min(1, 1200 / Math.max(sw, sh));
          c.width = Math.round(sw * k); c.height = Math.round(sh * k);
        }
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        if (enhance) ctx.filter = 'brightness(1.04) contrast(1.08) saturate(1.10)';
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        if (enhance) { // viñeta muy sutil para centrar la atención en la prenda
          ctx.filter = 'none';
          const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
          g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.10)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function sysNotify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, icon: 'icons/lpm-192.png', badge: 'icons/lpm-192.png', tag: 'lpm-' + Date.now() };
  (navigator.serviceWorker?.getRegistration() ?? Promise.resolve(null))
    .then(reg => reg ? reg.showNotification(title, opts) : new Notification(title, opts))
    .catch(() => { try { new Notification(title, opts); } catch {} });
}
function sendNotif(user, title, body, orderId, extra = {}) {
  db.notifications.push({ id: uid('n'), to: user.id, title, body, orderId, at: new Date().toISOString(), read: false, ...extra });
  if (user.id === ui.sessionId) sysNotify(title, body);
}
function sendMail(user, subject, body, orderId) {
  db.emails.push({ id: uid('e'), toUserId: user.id, to: user.email, subject, body: `Hola ${user.name.split(' ')[0]}:\n\n${body}\n\n— ${APP_NAME}`, orderId, at: new Date().toISOString() });
}

}

function downloadCsv(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  saveOffer() {
    const d = ui.offerDraft, m = modelById(d.modelId), prev = m.offer || {};
    const percent = Math.round(+d.percent), buy = Math.round(+d.buy), pay = Math.round(+d.pay), dur = Math.round(+d.duration);
    if (d.active) {
      if (d.type === 'units' && !(buy >= 2 && pay >= 1 && pay < buy)) return toast('En el lote, las unidades que paga deben ser menos que las que lleva (p. ej. 3x2)', 'error');
      if (d.type !== 'units' && !(percent >= 1 && percent <= 99)) return toast('El descuento debe estar entre 1 y 99 %', 'error');
    }
    const running = prev.type === 'time' && prev.active && new Date(prev.endsAt) > new Date();
    let endsAt = null;
    if (d.type === 'time') {
      if (running && !d.restart) endsAt = prev.endsAt;
      else {
        if (!(dur >= 1)) return toast('Indica la duración de la oferta', 'error');
        endsAt = new Date(Date.now() + dur * (d.unit === 'h' ? 36e5 : 864e5)).toISOString();
      }
    }
    const wasActive = offerActive(m), before = JSON.stringify(prev);
    m.offer = { active: !!d.active, type: d.type, percent: d.type === 'units' ? null : percent, buy: d.type === 'units' ? buy : null, pay: d.type === 'units' ? pay : null, endsAt };

    toast(d.active ? `Oferta activada: ${offerShort(m.offer)}${endsAt ? ' · ' + countdown(endsAt).toLowerCase() : ''}` : 'Oferta desactivada', 'ok');

      alertAdmins('pedido', o, `Pedido modificado: ${m.name}`, `${me().name} ha modificado su pedido de ${m.name}.
Ahora: ${itemsText(items)} · ${money(orderTotal(o))} · pendiente de aprobar.`); }
    else { db.orders.push({ id: uid('o'), userId: ui.sessionId, modelId: mid, modelName: m.name, unitPrice: m.price, offer: offerSnapshot(m), items, status: 'pendiente', createdAt: now, updatedAt: now }); toast('¡Solicitud enviada al administrador!');
      const no = db.orders.at(-1);
      alertAdmins('pedido', no, `Nueva solicitud: ${m.name}`, `${me().name} ha solicitado ${m.name} (${catName(catOf(m))}).
Tallas: ${itemsText(items)} · ${money(orderTotal(no))} · pendiente de aprobar.`);
      save(); render();
      syncChain.then(() => callMail({ type: 'order', orderId: no.id })); // email al usuario, a los admins y a La Prima Mery
      return; }
    save(); render();
  },
  cancelOrder(oid) {
    const o = db.orders.find(x => x.id === oid);
    if (!o || o.status !== 'pendiente' || !confirm('¿Cancelar esta solicitud?')) return;
    db.orders = db.orders.filter(x => x.id !== oid); delete ui.sel[o.modelId]; save(); render(); toast('Pedido cancelado', 'info');
  },
  async requestPaymentCheck(oid) {
    const o = db.orders.find(x => x.id === oid);
    if (!o || o.status !== 'aprobado') return;
    if (!confirm(`¿Ya has hecho el depósito de ${money(orderTotal(o))} por PayPal a ${PAYPAL_ACCOUNT}?\n\nSe avisará a La Prima Mery para que compruebe el pago.`)) return;
    const r = await callMail({ type: 'paid-notice', orderId: oid });
    // el servidor cambia el estado aunque falle el email (lo indica con mailError)
    if (!r.ok) return toast(r.notConfigured ? 'El aviso de pago aún no está disponible: el correo de La Prima Mery no está configurado.' : r.error || 'No se pudo enviar el aviso. Inténtalo de nuevo.', 'error');
    alertAdmins('pago', o, `Pago comunicado: ${o.modelName}`, `${me().name} dice que ya ha hecho el depósito de ${money(orderTotal(o))} por PayPal a ${PAYPAL_ACCOUNT} (${o.modelName}: ${itemsText(o.items)}).
Comprueba el pago y valídalo en la pestaña Pedidos indicando la fecha de entrega.`);
    save(); await syncChain; await fetchAll(); render();
    toast(r.data?.mailError ? 'Aviso enviado en la app, pero falló el email a La Prima Mery.' : 'Aviso enviado. Te avisaremos cuando comprobemos el pago.', r.data?.mailError ? 'error' : 'ok');
  },

  // --- admin: panel / pedidos ---
  setPanelPaid(v) { ui.panelPaidOnly = v; render(); },
  filter(k, v) {
    ui.filters[k] = v;
    if (ui.tables?.orders && ['q', 'cat', 'model', 'status', 'from', 'to'].includes(k)) ui.tables.orders.page = 0;
    if (ui.tables?.payments && ['puser', 'pfrom', 'pto'].includes(k)) ui.tables.payments.page = 0;
    render();
    if (k === 'q') { const el = document.getElementById('f-q'); el.focus(); el.setSelectionRange(v.length, v.length); }
  },
  tf(key, col, v, isSelect) {
    const st = tableState(key); st.f[col] = v; st.page = 0; render();
    if (isSelect) return;
    const el = document.getElementById(`tf-${key}-${col}`); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
  },
  tpage(key, d) { tableState(key).page += d; render(); },
  tsort(key, col) {
    const st = tableState(key);
    st.sort = st.sort?.key === col ? { key: col, dir: st.sort.dir === 'desc' ? 'asc' : 'desc' } : { key: col, dir: 'desc' };
    st.page = 0; render();
  },
  tclear(key) { tableState(key).f = {}; tableState(key).page = 0; render(); },
  deleteOrder(oid) {
    if (!confirm('¿Eliminar este pedido definitivamente?')) return;
    db.orders = db.orders.filter(x => x.id !== oid); save(); render(); toast('Pedido eliminado', 'info');
  },
  exportBatch() {
    const os = db.orders.filter(o => !ui.panelPaidOnly || o.status === 'pagado');
    const rows = [['Tipo', 'Modelo', ...SIZES, 'Total', 'Usuarios']];
    [...db.models].filter(m => inCat(m, ui.panelCat)).sort((a, b) => catName(catOf(a)).localeCompare(catName(catOf(b)))).forEach(m => {
      const mo = os.filter(o => o.modelId === m.id); if (!mo.length) return;
      rows.push([catName(catOf(m)), m.name, ...SIZES.map(s => mo.reduce((a, o) => a + (o.items[s] || 0), 0)), mo.reduce((a, o) => a + units(o.items), 0), new Set(mo.map(o => o.userId)).size]);
    });
    downloadCsv(`lote-fabricacion${ui.panelPaidOnly ? '-pagados' : ''}-${new Date().toISOString().slice(0, 10)}.csv`, rows);
  },
  exportOrders() {
    const rows = [['Fecha', 'Usuario', 'Email', 'Tipo', 'Modelo', ...SIZES, 'Unidades', 'Importe', 'Estado', 'Fecha aprobación solicitud', 'Fecha aprobación de pago', 'Fecha de entrega']];
    filteredOrders().forEach(o => {
      const u = userById(o.userId), a = approvedAt(o), p = paidAt(o);
      rows.push([fmtDate(o.createdAt), u?.name, u?.email, catName(catOf(modelById(o.modelId))), o.modelName, ...SIZES.map(s => o.items[s] || 0), units(o.items), orderTotal(o).toFixed(2).replace('.', ','), statusLabel(o.status), a ? fmtDate(a) : 'Pendiente', p ? fmtDate(p) : 'Pendiente', deliveryDate(o)]);
    });
    downloadCsv(`pedidos-${new Date().toISOString().slice(0, 10)}.csv`, rows);
  },

  // --- admin: modelos ---
  editModel(id) {
    const m = id ? modelById(id) : null;
    ui.draft = m ? JSON.parse(JSON.stringify(m)) : { categoryId: ui.modelCat && ui.modelCat !== NO_CAT ? ui.modelCat : '', name: '', description: '', price: 15, sizes: [...SIZES], images: [], color: '#e2e8f0', ink: '#334155' };
    if (ui.draft.categoryId && catOf(ui.draft) === NO_CAT) ui.draft.categoryId = '';
    openModal(modelForm(), true);
  },
  draftSet(k, v) { ui.draft[k] = v; },
  draftCat(v) {
    if (v !== '__new') { ui.draft.categoryId = v; return; }
    const name = (prompt('Nombre del nuevo tipo de modelo:') || '').trim();
    const c = name && App.addCat(name, true);
    if (c) ui.draft.categoryId = c.id;
    App.draftRerender();
  },
  // --- admin: tipos de modelo ---
  setCat(id) { ui.cat = id; ui.catModel = ''; render(); },
  catalogFilter(k, v) {
    ui[k] = v; render();
    if (k === 'catQ') { const el = document.getElementById('cat-q'); el.focus(); el.setSelectionRange(v.length, v.length); }
  },
  clearCatalogFilters() { ui.cat = ''; ui.catQ = ''; ui.catModel = ''; render(); },
  setModelCat(id) { ui.modelCat = id; render(); },
  setPanelCat(id) { ui.panelCat = id; render(); },
  manageCats() { openModal(catsForm()); },
  addCat(name, silent) {
    name = name.trim();
    if (!name) return null;
    const dup = db.categories.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (dup) { toast('Ese tipo ya existe', 'error'); return dup; }
    const c = { id: uid('c'), name };
    db.categories.push(c); save(); render();
    if (!silent) { openModal(catsForm()); toast(`Tipo «${name}» añadido`); }
    return c;
  },
  renameCat(id, name) {
    name = name.trim();
    if (!name) return openModal(catsForm());
    if (db.categories.some(c => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) { toast('Ese tipo ya existe', 'error'); return openModal(catsForm()); }
    db.categories.find(c => c.id === id).name = name; save(); render(); toast('Tipo renombrado');
  },
  deleteCat(id) {
    const c = db.categories.find(x => x.id === id), n = db.models.filter(m => !m.deletedAt && m.categoryId === id).length;
    if (n) return toast(`«${c.name}» lo usan ${n} modelo(s). Cámbialos de tipo antes de eliminarlo.`, 'error');
    if (!confirm(`¿Eliminar el tipo «${c.name}»?`)) return;
    db.categories = db.categories.filter(x => x.id !== id);
    for (const k of ['cat', 'modelCat', 'panelCat']) if (ui[k] === id) ui[k] = '';
    if (ui.filters.cat === id) ui.filters.cat = '';
    save(); render(); openModal(catsForm()); toast('Tipo eliminado', 'info');
  },
  draftSize(s, on) { ui.draft.sizes = on ? SIZES.filter(x => x === s || ui.draft.sizes.includes(x)) : ui.draft.sizes.filter(x => x !== s); },
  draftRerender() { const st = document.querySelector('#modal-root .overflow-y-auto')?.scrollTop; openModal(modelForm(), true); const box = document.querySelector('#modal-root .overflow-y-auto'); if (box) box.scrollTop = st || 0; },
  draftCover(i) { const [x] = ui.draft.images.splice(i, 1); ui.draft.images.unshift(x); App.draftRerender(); },
  draftRemoveImg(i) { ui.draft.images.splice(i, 1); App.draftRerender(); },
  draftAddUrl() {
    const v = document.getElementById('img-url').value.trim();
    if (!/^https?:\/\/\S+$/i.test(v)) return toast('Introduce una URL https:// válida', 'error');
    ui.draft.images.push(v); App.draftRerender();
  },
  async uploadImgs(files) {
    const enhance = ui.enhance !== false, st = document.getElementById('upload-status');
    for (const [i, f] of [...files].entries()) {
      st.textContent = `${enhance ? 'Mejorando' : 'Procesando'} foto ${i + 1} de ${files.length}…`;
      try {
        const dataUrl = await enhanceImage(f, enhance);
        st.textContent = `Subiendo foto ${i + 1} de ${files.length}…`;
        ui.draft.images.push(await uploadPhoto(dataUrl));
      } catch (e) { toast(`${f.name}: ${e.message}`, 'error'); }
    }
    App.draftRerender();
    toast(enhance ? 'Fotos mejoradas y subidas' : 'Fotos subidas');
  },
  saveModel() {
    const d = ui.draft, price = parseFloat(String(d.price).replace(',', '.'));
    if (!d.categoryId) return toast('Elige el tipo de modelo', 'error');
    if (!d.name.trim()) return toast('El nombre es obligatorio', 'error');
    if (!(price >= 0)) return toast('Precio no válido', 'error');
    if (!d.sizes.length) return toast('Marca al menos una talla', 'error');
    if (!d.images.length) return toast('Añade al menos una foto', 'error');
    const data = { categoryId: d.categoryId, name: d.name.trim(), description: d.description.trim(), price, sizes: d.sizes, images: d.images };
    const backup = JSON.stringify(db.models);
    if (d.id) {
      Object.assign(modelById(d.id), data);
      db.orders.filter(o => o.modelId === d.id && o.status !== 'pagado').forEach(o => { o.modelName = data.name; o.unitPrice = price; });
      db.orders.filter(o => o.modelId === d.id).forEach(o => o.modelName = data.name);
    } else db.models.push({ id: d.newId = uid('m'), color: d.color, ink: d.ink, createdAt: new Date().toISOString(), ...data });
    if (!save()) { db.models = JSON.parse(backup); return; }
    closeModal(); ui.sel = {}; render(); toast(d.id ? 'Modelo actualizado' : 'Modelo publicado en el catálogo');
    if (!d.id) App.announceModel(d.newId, true); // todo modelo nuevo se anuncia a los usuarios activos
  },
  // Aviso de modelo nuevo u oferta: notificación en la app (y copia en el buzón) para cada usuario activo, y email
  // automático desde laprimamery@gmail.com a todos ellos (Edge Function send-mail, en copia oculta).
  async announceModel(id, auto, kind = 'new-model') {
    const m = modelById(id), isOffer = kind === 'offer';
    if (!auto && !confirm(`¿Avisar a todos los usuarios de «${m.name}» por notificación y email?`)) return;
    const now = new Date().toISOString(), users = db.users.filter(u => u.active && !u.pending && u.role !== 'admin');
    const text = isOffer ? `${offerLong(m.offer)} en «${m.name}». ¡Aprovéchala!` : `Ya puedes pedir «${m.name}» (${catName(catOf(m))}, ${money(m.price)}) en el catálogo.`;
    const title = isOffer ? `Oferta: ${m.name}` : `Nuevo modelo: ${m.name}`;
    users.forEach(u => {
      db.notifications.push({ id: uid('n'), to: u.id, title, body: text, orderId: null, at: now, read: false });
      sendMail(u, `[${APP_NAME}] ${title}`, `${text}\n\n${m.description}`, null);
    });
    save(); await syncChain; // el modelo (y su oferta) tiene que estar guardado antes de enviar los emails
    const r = await callMail({ type: 'broadcast', kind, modelId: id });
    toast(r.ok ? `Aviso enviado a ${users.length} usuarios por notificación y a ${r.data.sent} por email`
      : mailNote(r, ''), r.ok || r.notConfigured ? 'ok' : 'error');
  },
  deleteModel(id) {
    const m = modelById(id), n = db.orders.filter(o => o.modelId === id).length;
    if (!confirm(`¿Eliminar «${m.name}» del catálogo?${n ? `\n\nTiene ${n} pedido(s): se conservarán en el historial y en el panel, pero los usuarios ya no podrán pedirlo.` : ''}`)) return;
    if (n) { m.deletedAt = new Date().toISOString(); m.images = m.images.slice(0, 1); } // se conserva la portada para el historial
    else db.models = db.models.filter(x => x.id !== id);
    save(); render(); toast('Modelo eliminado', 'info');
  },

  // --- admin: usuarios ---
  editUser(id) { openModal(userForm(id ? userById(id) : null)); },
  // Las cuentas se gestionan con funciones seguras de la base de datos (solo las puede usar un administrador).
  async saveUser(form, id) {
    const f = Object.fromEntries(new FormData(form)), u = id ? userById(id) : null;
    const { error } = await sb.rpc('admin_save_user', {
      p_id: id || null, p_email: f.email.trim(), p_password: f.password || null, p_name: f.name.trim(),
      p_username: f.username.trim(), p_role: f.role || u?.role || 'user', p_active: u ? u.active : true, p_phone: f.phone?.trim() || null,
    });
    if (error) return toast(error.message, 'error');
    await fetchAll(); closeModal(); render();
    toast(id ? 'Usuario actualizado' : `Usuario @${f.username.trim()} creado`);
  },
  async toggleUser(id) {
    const u = userById(id);
    const { error } = await sb.rpc('admin_save_user', { p_id: id, p_email: u.email, p_password: null, p_name: u.name, p_username: u.username, p_role: u.role, p_active: !u.active, p_phone: u.phone || null });
    if (error) return toast(error.message, 'error');
    await fetchAll(); render(); toast(u.active ? 'Usuario dado de baja: ya no puede entrar ni pedir' : 'Usuario reactivado', 'info');
  },
  async deleteUser(id) {
    const u = userById(id), n = db.orders.filter(o => o.userId === id).length;
    if (!confirm(`¿Eliminar DEFINITIVAMENTE a ${u.name}?\nSe borrará su cuenta y no se puede deshacer.${n ? `\nSus ${n} pedido(s) también se eliminarán.` : ''}\n\nSi solo quieres que deje de usar la app, usa «Dar de baja».`)) return;
    const { error } = await sb.rpc('admin_delete_user', { p_id: id });
    if (error) return toast(error.message, 'error');
    await fetchAll(); render(); toast('Usuario eliminado definitivamente', 'info');
  },

  // --- admin: ajustes ---
  saveSettings(form) {
    const f = Object.fromEntries(new FormData(form));
    db.settings.maxUnits = parseInt(f.maxUnits) > 0 ? parseInt(f.maxUnits) : null; // vacío = sin límite
    db.settings.alertNotif = !!f.alertNotif; db.settings.alertEmail = !!f.alertEmail; db.settings.smsEnabled = !!f.smsEnabled;
    db.settings.currency = f.currency;
    save(); render(); toast('Ajustes guardados');
  },

};
window.App = App;

// =========================================================================
// ARRANQUE Y SESIÓN
// =========================================================================
async function enterSession(userId, fresh) {
  ui.sessionId = userId; ui.loading = true; ui.tab = null; ui.sel = {}; render();
  try { await fetchAll(); }
  catch (e) { console.error(e); toast('No se pudieron cargar los datos: ' + e.message, 'error'); }
  ui.loading = false;
  const u = me();
  if (!u) {
    const pend = db.users.find(x => x.id === userId)?.pending;
    await sb.auth.signOut(); ui.sessionId = null; db = emptyDb(); render();
    if (pend) return openModal(pendingSheet(true));
    return toast('Esta cuenta está desactivada. Habla con el administrador.', 'error');
  }
  render(); subscribeRealtime();
  if (fresh) toast(`Hola, ${u.name.split(' ')[0]}`, 'info');
  const n = unread(); if (n) sysNotify(APP_NAME, `Tienes ${n} aviso${n === 1 ? '' : 's'} sin leer.`);
  if (ui.recovery) openModal(newPasswordForm(true)); else offerInstallOnce();
}
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { ui.recovery = true; if (me()) openModal(newPasswordForm(true)); }
  if (event === 'SIGNED_OUT' && ui.sessionId) { ui.sessionId = null; db = emptyDb(); render(); }
});
(async () => {
  ui.loading = true; render();
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterSession(session.user.id, false);
  else { ui.loading = false; render(); if (new URLSearchParams(location.search).has('registro')) App.openSignup(); }
})();
</script>
</body>
</html>
